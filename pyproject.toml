[project]
name = "flowaudio"
version = "0.1.0"
description = "AI Voice Processing project with Hugging Face and PyTorch CUDA 12.1"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "transformers>=4.35.0",
    "accelerate",
    "optimum",
    "soundfile",
    "librosa",
    "psutil",
    "protobuf",
    "sentencepiece",
    "colorama",
    "torch",
    "torchvision",
    "torchaudio",
    "sounddevice>=0.5.3",
    "pyqt6>=6.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- UV Specific Configuration for PyTorch CUDA 12.1 ---
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
[tool.hatch.build.targets.wheel]
packages = ["."]
